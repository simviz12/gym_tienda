<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark Background -->
  <rect width="100" height="100" rx="20" fill="#18181b"/>
  
  <g transform="translate(50,50) rotate(45) translate(-50,-50)">
    <!-- Handle -->
    <rect x="25" y="44" width="50" height="12" fill="#e11d48" rx="2"/>
    
    <!-- Left Weights -->
    <rect x="20" y="30" width="8" height="40" fill="#ffffff" rx="3"/>
    <rect x="10" y="20" width="8" height="60" fill="#ffffff" rx="3"/>
    
    <!-- Right Weights -->
    <rect x="72" y="30" width="8" height="40" fill="#ffffff" rx="3"/>
    <rect x="82" y="20" width="8" height="60" fill="#ffffff" rx="3"/>
  </g>
</svg>